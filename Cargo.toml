[workspace]
resolver = "2"
members = [
    "crates/rocket-core",
    "crates/rocket-physics",
    "crates/rocket-aero",
    "crates/rocket-sim",
    "crates/rocket-motors",
    "crates/rocket-monte-carlo",
    "crates/rocket-optimizer",
    "crates/rocket-render",
    "crates/rocket-io",
    "crates/rocket-ui",
    "crates/rocket-cli",
    "crates/aether-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.95"
description = "A professional rocket design and 6-DOF flight simulator"
repository = "https://github.com/aether-sim/aether"
homepage = "https://github.com/aether-sim/aether"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

# Dependencies used by later phases (uncomment when needed):
# nalgebra = "0.33"
# ndarray = "0.16"
# thiserror = "2.0"
# tracing = "0.1"
# rayon = "1.10"
# egui = "0.29"
# eframe = "0.29"
# egui_dock = "0.14"
# egui_plot = "0.29"
# wgpu = "22.0"
# three-d = "0.18"
# reqwest = { version = "0.12", features = ["json"] }
# tokio = { version = "1.40", features = ["full"] }
# directories = "5.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
