[package]
name = "rocket-ui"
description = "Aether GUI: egui-based design editor, sim control, plots, and 3D playback."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "aether-ui"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
rocket-core = { path = "../rocket-core", version = "0.1.0" }
rocket-render = { path = "../rocket-render", version = "0.1.0" }
bytemuck = { version = "1", features = ["derive"] }

[lints]
workspace = true
