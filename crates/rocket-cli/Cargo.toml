[package]
name = "rocket-cli"
description = "Aether command-line interface: headless batch simulation and motor management."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
rocket-motors = { path = "../rocket-motors", version = "0.1.0" }
rocket-io = { path = "../rocket-io", version = "0.1.0" }
rocket-sim = { path = "../rocket-sim", version = "0.1.0" }
rocket-aero = { path = "../rocket-aero", version = "0.1.0" }
rocket-cfd = { path = "../rocket-cfd", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
