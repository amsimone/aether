name: CI

# Minimal single-OS CI: fmt + clippy + test + DAG check + cargo-deny.
# Runs in ~2 min. The 3-OS matrix can be re-enabled later if needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo nextest run --workspace

      - name: CFD adapter contracts (no external solver needed)
        run: python3 -m unittest discover -s crates/rocket-cfd/tests -v

      - name: Doc
        run: cargo doc --workspace --no-deps

      - name: Deny (licenses + advisories)
        run: cargo deny check

      - name: Dependency DAG check (ADR-0001)
        run: ./scripts/check_dag.sh
